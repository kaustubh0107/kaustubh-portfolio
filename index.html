<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kaustubh Lande — Frontend / React Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<style>
  :root {
    --bg: #F2F0EC;
    --surface: #FFFFFF;
    --border: #DDD9D1;
    --text: #1C1B1E;
    --text-muted: #6C6970;
    --accent: #2F7A52;
    --accent-soft: rgba(47, 122, 82, 0.13);
    --accent-text-on: #FBF7F6;
    --shadow: rgba(20, 17, 18, 0.08);
    --bezel-1: #26272B;
    --bezel-2: #17181B;
  }

  :root:not([data-theme="light"]) {
    --bg: #131316;
    --surface: #1D1D22;
    --border: #333238;
    --text: #EDEDF0;
    --text-muted: #9C9BA4;
    --accent: #4C9A6A;
    --accent-soft: rgba(76, 154, 106, 0.16);
    --accent-text-on: #131316;
    --shadow: rgba(0, 0, 0, 0.42);
    --bezel-1: #4B4C53;
    --bezel-2: #2D2E33;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F2F0EC;
      --surface: #FFFFFF;
      --border: #DDD9D1;
      --text: #1C1B1E;
      --text-muted: #6C6970;
      --accent: #2F7A52;
      --accent-soft: rgba(47, 122, 82, 0.13);
      --accent-text-on: #FBF7F6;
      --shadow: rgba(20, 17, 18, 0.08);
      --bezel-1: #26272B;
      --bezel-2: #17181B;
    }
  }

  :root[data-theme="dark"] {
    --bg: #131316;
    --surface: #1D1D22;
    --border: #333238;
    --text: #EDEDF0;
    --text-muted: #9C9BA4;
    --accent: #4C9A6A;
    --accent-soft: rgba(76, 154, 106, 0.16);
    --accent-text-on: #131316;
    --shadow: rgba(0, 0, 0, 0.42);
    --bezel-1: #4B4C53;
    --bezel-2: #2D2E33;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background:
      radial-gradient(1100px 600px at 85% -10%, var(--accent-soft), transparent 60%),
      radial-gradient(800px 500px at -10% 15%, var(--accent-soft), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s ease, color 0.3s ease;
    overflow-x: hidden;
    position: relative;
  }

  /* Ambient glow that follows the pointer, very low opacity — a quiet sense of depth, not a spotlight */
  .ambient-glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(460px circle at var(--mx, 50%) var(--my, 20%), var(--accent-soft), transparent 70%);
    opacity: 0.4;
    transition: opacity 0.4s ease;
    will-change: background;
  }
  @media (max-width: 800px) { .ambient-glow { display: none; } }
  .nav, .wrap, footer { position: relative; z-index: 1; }

  .particle-field {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.9;
  }
  @media (prefers-reduced-motion: reduce) { .particle-field { display: none; } }

  h1, h2, h3, .display {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  ::selection { background: var(--accent-soft); color: var(--text); }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 32px;
  }

  @media (max-width: 640px) {
    .wrap { padding: 0 20px; }
  }

  /* ---------- Nav ---------- */
  .nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0;
  }
  .nav-mark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 15px;
    width: 36px;
    height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--accent);
    cursor: pointer;
    transition: border-color 0.3s ease, transform 0.5s ease, box-shadow 0.3s ease;
    animation: mark-breathe 4s ease-in-out infinite;
  }
  .nav-mark:hover {
    border-color: var(--accent);
    transform: rotate(8deg) scale(1.06);
    box-shadow: 0 0 0 5px var(--accent-soft);
  }
  @keyframes mark-breathe {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft); }
    50% { box-shadow: 0 0 0 4px var(--accent-soft); }
  }
  @media (prefers-reduced-motion: reduce) { .nav-mark { animation: none; } }
  .nav-links {
    display: flex;
    gap: 28px;
    align-items: center;
  }
  .nav-links a {
    position: relative;
    font-size: 14px;
    color: var(--text-muted);
    transition: color 0.2s ease;
    padding-bottom: 3px;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    left: 0; right: 100%;
    bottom: 0;
    height: 1px;
    background: var(--accent);
    transition: right 0.3s ease;
  }
  .nav-links a:hover { color: var(--text); }
  .nav-links a:hover::after,
  .nav-links a.active::after { right: 0; }
  .nav-links a.active { color: var(--text); }
  .theme-toggle {
    background: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--text); }
  @media (max-width: 640px) {
    .nav-links span.sep-links { display: none; }
  }

  .nav-hamburger {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 32px;
    height: 32px;
    background: none;
    border: none;
    padding: 0;
  }
  .nav-hamburger span {
    display: block;
    width: 100%;
    height: 2px;
    background: var(--text);
    border-radius: 2px;
    transition: transform 0.25s ease, opacity 0.2s ease;
  }
  .nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav-hamburger.open span:nth-child(2) { opacity: 0; }
  .nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .nav-mobile-panel {
    display: none;
    flex-direction: column;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    border-top: 1px solid transparent;
  }
  .nav-mobile-panel.open {
    max-height: 400px;
    border-top-color: var(--border);
  }
  .nav-mobile-panel a {
    padding: 14px 20px;
    font-size: 15px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  .nav-mobile-panel a.active { color: var(--accent); }
  .nav-mobile-toggle { padding: 14px 20px; }

  @media (max-width: 720px) {
    .nav-links { display: none; }
    .nav-hamburger { display: flex; }
    .nav-mobile-panel { display: flex; }
  }

  /* ---------- Hero ---------- */
  .hero {
    padding: 88px 0 72px;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
    gap: 40px;
    align-items: center;
    position: relative;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: -20px -40px auto -40px;
    height: 420px;
    background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
    background-size: 26px 26px;
    opacity: 0.5;
    -webkit-mask-image: radial-gradient(ellipse 60% 60% at 30% 30%, black 40%, transparent 80%);
    mask-image: radial-gradient(ellipse 60% 60% at 30% 30%, black 40%, transparent 80%);
    animation: grid-drift 40s linear infinite;
    pointer-events: none;
    z-index: -1;
  }
  .hero::after {
    content: 'KL';
    position: absolute;
    right: -10px;
    top: -40px;
    font-family: 'Fraunces', serif;
    font-size: clamp(160px, 22vw, 300px);
    font-weight: 700;
    line-height: 1;
    color: var(--text);
    opacity: 0.035;
    pointer-events: none;
    z-index: -1;
    user-select: none;
  }
  @media (max-width: 800px) { .hero::after { display: none; } }
  @keyframes grid-drift {
    0% { background-position: 0 0; }
    100% { background-position: 130px 130px; }
  }
  @media (prefers-reduced-motion: reduce) { .hero::before { animation: none; } }
  @media (max-width: 800px) {
    .hero { grid-template-columns: 1fr; padding: 56px 0 48px; }
  }
  .eyebrow-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .eyebrow {
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 0;
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px 4px 10px;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #4CAF7D;
    box-shadow: 0 0 0 0 rgba(76, 175, 125, 0.5);
    animation: status-pulse 2s ease-out infinite;
  }
  @keyframes status-pulse {
    0% { box-shadow: 0 0 0 0 rgba(76, 175, 125, 0.5); }
    70% { box-shadow: 0 0 0 6px rgba(76, 175, 125, 0); }
    100% { box-shadow: 0 0 0 0 rgba(76, 175, 125, 0); }
  }
  @media (prefers-reduced-motion: reduce) { .status-dot { animation: none; } }
  .hero h1 {
    font-size: clamp(38px, 6vw, 60px);
    line-height: 1.05;
  }
  .hero-role {
    margin-top: 14px;
    font-size: 19px;
    color: var(--text-muted);
    max-width: 46ch;
  }
  .caret {
    display: inline-block;
    color: var(--accent);
    font-weight: 600;
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
  .hero-cta {
    margin-top: 34px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .hero-stats {
    margin-top: 40px;
    padding-top: 28px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 36px;
    flex-wrap: wrap;
  }
  .hero-stat-num {
    font-family: 'Fraunces', serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--accent);
    line-height: 1;
  }
  .hero-stat-label {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--text-muted);
    max-width: 16ch;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 14.5px;
    font-weight: 600;
    border: 1px solid transparent;
    transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .btn-primary {
    background: var(--accent);
    color: var(--accent-text-on);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px var(--accent-soft);
  }
  .btn-ghost {
    border-color: var(--border);
    color: var(--text);
  }
  .btn-ghost:hover { border-color: var(--accent); }

  .btn-resume {
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #e8955f));
    color: var(--accent-text-on);
    box-shadow: 0 0 0 0 var(--accent-soft), 0 4px 14px var(--accent-soft);
    animation: resume-glow 3.2s ease-in-out infinite;
    order: -1;
  }
  .btn-resume:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 8px 24px var(--accent-soft);
  }
  @keyframes resume-glow {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft), 0 4px 14px var(--accent-soft); }
    50% { box-shadow: 0 0 0 7px transparent, 0 4px 20px var(--accent-soft); }
  }
  @media (prefers-reduced-motion: reduce) { .btn-resume { animation: none; } }

  .hero-art {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .hero-art::before {
    content: '';
    position: absolute;
    width: 70%; height: 70%;
    background: radial-gradient(circle, var(--accent-soft), transparent 70%);
    border-radius: 50%;
    filter: blur(6px);
    animation: orbit 12s ease-in-out infinite;
  }
  @keyframes orbit {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-3%, 4%) scale(1.06); }
  }
  .hero-art svg {
    width: 100%; height: 100%; max-width: 360px;
    position: relative;
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-art::before { animation: none; }
  }

  /* Laptop mockup with live-typing code — built from the actual medium this work ships in */
  .laptop-mock {
    width: 100%;
    max-width: 340px;
    position: relative;
    animation: laptop-float 6s ease-in-out infinite;
  }
  @keyframes laptop-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .laptop-bezel {
    background: linear-gradient(160deg, var(--bezel-1), var(--bezel-2));
    border-radius: 16px 16px 5px 5px;
    padding: 16px 12px 8px;
    box-shadow: 0 28px 54px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08), 0 0 0 1px rgba(255,255,255,0.04);
    position: relative;
    transform: perspective(1000px) rotateX(4deg);
  }
  .laptop-camera {
    position: absolute;
    top: 6px; left: 50%;
    transform: translateX(-50%);
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #0B0C0D;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.14);
  }
  .laptop-screen {
    background: var(--surface);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  .laptop-screen-sheen {
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, rgba(255,255,255,0.07), transparent 45%);
    pointer-events: none;
  }
  .laptop-topbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .laptop-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
  .laptop-dot.accent { background: var(--accent); opacity: 0.7; }
  .laptop-filename {
    margin-left: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    color: var(--text-muted);
  }
  .laptop-code {
    padding: 16px 18px 20px;
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    font-size: 11.5px;
    line-height: 1.85;
    min-height: 190px;
    white-space: pre-wrap;
    word-break: break-word;
    position: relative;
  }
  .code-line { color: var(--text-muted); }
  .code-token { color: var(--accent); font-weight: 600; }
  .code-caret {
    display: inline-block;
    width: 6px;
    height: 12px;
    background: var(--accent);
    margin-left: 1px;
    transform: translateY(2px);
    animation: blink 0.9s step-end infinite;
  }
  .laptop-base {
    height: 14px;
    margin: 0 -14px;
    background: linear-gradient(var(--bezel-1), var(--bezel-2));
    border-radius: 0 0 10px 10px;
    box-shadow: 0 12px 22px var(--shadow);
    position: relative;
  }
  .laptop-trackpad {
    position: absolute;
    top: 2px; left: 50%;
    transform: translateX(-50%);
    width: 72px; height: 5px;
    background: #131416;
    border-radius: 0 0 6px 6px;
  }
  @media (prefers-reduced-motion: reduce) {
    .laptop-mock { animation: none; }
    .code-caret { animation: none; }
  }

  /* ---------- Section shell ---------- */
  section { padding: 64px 0; border-top: 1px solid var(--border); }
  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 36px;
    gap: 20px;
  }
  .section-head h2 {
    font-size: 28px;
    position: relative;
    display: inline-block;
  }
  .section-head h2::after {
    content: '';
    position: absolute;
    left: 0; bottom: -8px;
    height: 2px;
    width: 46px;
    background: linear-gradient(90deg, var(--accent), transparent);
    transform-origin: left;
    transform: scaleX(0);
    transition: transform 0.6s ease 0.15s;
  }
  .reveal.in .section-head h2::after { transform: scaleX(1); }
  .section-num {
    font-family: 'Inter', monospace;
    font-size: 12.5px;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 11px;
  }

  /* ---------- Scroll reveal ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .reveal.in { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
  }

  /* Cascade: children of a revealed section settle in with a slight stagger */
  .reveal .skill-group,
  .reveal .tl-item,
  .reveal .proj-card,
  .reveal .edu-card {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .reveal.in .skill-group,
  .reveal.in .tl-item,
  .reveal.in .proj-card,
  .reveal.in .edu-card {
    opacity: 1;
    transform: translateY(0);
  }
  .reveal.in .skill-group:nth-child(1) { transition-delay: 0.05s; }
  .reveal.in .skill-group:nth-child(2) { transition-delay: 0.13s; }
  .reveal.in .skill-group:nth-child(3) { transition-delay: 0.21s; }
  .reveal.in .skill-group:nth-child(4) { transition-delay: 0.29s; }
  .reveal.in .tl-item:nth-child(1) { transition-delay: 0.05s; }
  .reveal.in .proj-card:nth-child(1) { transition-delay: 0.06s; }
  .reveal.in .proj-card:nth-child(2) { transition-delay: 0.14s; }
  .reveal.in .proj-card:nth-child(3) { transition-delay: 0.22s; }
  .reveal.in .proj-card:nth-child(4) { transition-delay: 0.3s; }
  .reveal.in .edu-card:nth-child(1) { transition-delay: 0.05s; }
  .reveal.in .edu-card:nth-child(2) { transition-delay: 0.14s; }
  @media (prefers-reduced-motion: reduce) {
    .reveal .skill-group, .reveal .tl-item, .reveal .proj-card, .reveal .edu-card {
      opacity: 1; transform: none; transition: none;
    }
  }

  /* ---------- About + Skills ---------- */
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 56px;
  }
  @media (max-width: 800px) {
    .about-grid { grid-template-columns: 1fr; gap: 36px; }
  }
  .about-copy p { color: var(--text-muted); margin: 0 0 16px; max-width: 52ch; }
  .about-copy p:last-child { margin-bottom: 0; }
  .about-copy strong { color: var(--text); font-weight: 600; }
  .achieve-list {
    margin: 4px 0 20px;
    padding: 0;
    list-style: none;
    max-width: 52ch;
  }
  .achieve-list li {
    position: relative;
    padding-left: 18px;
    margin-bottom: 10px;
    color: var(--text-muted);
    font-size: 15px;
  }
  .achieve-list li::before {
    content: '';
    position: absolute; left: 0; top: 9px;
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 1px;
  }
  .achieve-list strong { color: var(--text); font-weight: 600; }

  .skill-group { margin-bottom: 22px; }
  .skill-group:last-child { margin-bottom: 0; }
  .skill-group h4 {
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 0 0 10px;
  }
  .skill-pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .skill-pill {

const { useState, useRef, useEffect, useMemo, useLayoutEffect } = React;

/* -------------------- Shared behaviour hooks -------------------- */

function useAmbientGlow() {
  useEffect(() => {
    let raf = null;
    let latest = null;
    const apply = () => {
      if (latest) {
        document.documentElement.style.setProperty('--mx', latest.x + 'px');
        document.documentElement.style.setProperty('--my', latest.y + 'px');
      }
      raf = null;
    };
    const move = (e) => {
      latest = { x: e.clientX, y: e.clientY };
      if (raf === null) raf = requestAnimationFrame(apply);
    };
    window.addEventListener('pointermove', move);
    return () => {
      window.removeEventListener('pointermove', move);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);
}

function hexToRgb(hex) {
  const m = hex.trim().replace('#', '');
  const full = m.length === 3 ? m.split('').map(c => c + c).join('') : m;
  const num = parseInt(full, 16);
  return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
}

function ParticleField() {
  const canvasRef = useRef(null);

  useEffect(() => {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    let width, height, dpr;
    let particles = [];
    let raf;
    const mouse = { x: -9999, y: -9999 };

    const isMobile = window.innerWidth < 700;
    const COUNT = isMobile ? 55 : 110;
    const LINK_DIST = isMobile ? 115 : 150;
    const REPEL_RADIUS = 150;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function init() {
      particles = Array.from({ length: COUNT }, () => {
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.16 + Math.random() * 0.22;
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          // permanent baseline drift — this is what keeps the field alive at rest
          bvx: Math.cos(angle) * speed,
          bvy: Math.sin(angle) * speed,
          // temporary velocity added by the cursor, decays back to zero on its own
          rvx: 0,
          rvy: 0,
        };
      });
    }

    function getColors() {
      const style = getComputedStyle(document.documentElement);
      return {
        line: hexToRgb(style.getPropertyValue('--text-muted').trim() || '#888888'),
        dot: hexToRgb(style.getPropertyValue('--accent').trim() || '#888888'),
      };
    }

    function step() {
      const { line, dot } = getColors();
      ctx.clearRect(0, 0, width, height);

      for (const p of particles) {
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < REPEL_RADIUS) {
          const force = (REPEL_RADIUS - dist) / REPEL_RADIUS;
          p.rvx += (dx / (dist || 1)) * force * 0.9;
          p.rvy += (dy / (dist || 1)) * force * 0.9;
        }
        // only the cursor-induced velocity decays; baseline drift is permanent
        p.rvx *= 0.93;
        p.rvy *= 0.93;

        p.x += p.bvx + p.rvx;
        p.y += p.bvy + p.rvy;

        if (p.x < -10) p.x = width + 10; if (p.x > width + 10) p.x = -10;
        if (p.y < -10) p.y = height + 10; if (p.y > height + 10) p.y = -10;
      }

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i], b = particles[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < LINK_DIST) {
            const alpha = (1 - d / LINK_DIST) * 0.55;
            ctx.strokeStyle = `rgba(${line[0]},${line[1]},${line[2]},${alpha})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      for (const p of particles) {
        ctx.fillStyle = `rgba(${dot[0]},${dot[1]},${dot[2]},0.8)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.9, 0, Math.PI * 2);
        ctx.fill();
      }

      raf = requestAnimationFrame(step);
    }

    function onMove(e) { mouse.x = e.clientX; mouse.y = e.clientY; }
    function onLeave() { mouse.x = -9999; mouse.y = -9999; }

    resize();
    init();
    raf = requestAnimationFrame(step);
    window.addEventListener('resize', resize);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerleave', onLeave);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerleave', onLeave);
    };
  }, []);

  return <canvas ref={canvasRef} className="particle-field" aria-hidden="true" />;
}

function useReveal(ref) {
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, [ref]);
}

function Reveal({ as: Tag = 'div', className = '', children, ...rest }) {
  const ref = useRef(null);
  useReveal(ref);
  return <Tag ref={ref} className={'reveal ' + className} {...rest}>{children}</Tag>;
}

function useScrollSpy(ids) {
  const [active, setActive] = useState(null);
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) setActive(entry.target.id);
      });
    }, { rootMargin: '-45% 0px -45% 0px' });
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) io.observe(el);
    });
    return () => io.disconnect();
  }, [ids]);
  return active;
}

function useBackToTopVisible() {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const hero = document.getElementById('hero');
    if (!hero) return;
    const io = new IntersectionObserver(
      ([entry]) => setShow(!entry.isIntersecting),
      { threshold: 0 }
    );
    io.observe(hero);
    return () => io.disconnect();
  }, []);
  return show;
}

function prefersReducedMotion() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function ScrambleText({ text }) {
  const ref = useRef(null);
  const [display, setDisplay] = useState(text);
  const [boxWidth, setBoxWidth] = useState(null);

  // Measure the final text's natural width BEFORE paint, so the box can be
  // locked to that size before any scrambled (differently-wide) characters
  // ever render — nothing around it can shift once this is set.
  useLayoutEffect(() => {
    if (ref.current) {
      setBoxWidth(ref.current.getBoundingClientRect().width);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [text]);

  useEffect(() => {
    if (prefersReducedMotion()) { setDisplay(text); return; }
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
    let iteration = 0;
    const stepsPerChar = 3;
    const totalSteps = text.length * stepsPerChar;
    let timer;
    const tick = () => {
      setDisplay(
        text.split('').map((ch, idx) => {
          if (ch === ' ') return ' ';
          if (idx * stepsPerChar < iteration) return ch;
          return chars[Math.floor(Math.random() * chars.length)];
        }).join('')
      );
      iteration += 1;
      if (iteration <= totalSteps) {
        timer = setTimeout(tick, 28);
      } else {
        setDisplay(text);
      }
    };
    tick();
    return () => clearTimeout(timer);
  }, [text]);

  return (
    <span
      ref={ref}
      style={boxWidth ? { display: 'inline-block', width: boxWidth + 'px', overflow: 'hidden', whiteSpace: 'nowrap' } : undefined}
    >
      {display}
    </span>
  );
}

function useTilt(ref, max = 4) {
  useEffect(() => {
    const el = ref.current;
    if (!el || prefersReducedMotion()) return;
    const onMove = (e) => {
      const rect = el.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width - 0.5;
      const py = (e.clientY - rect.top) / rect.height - 0.5;
      el.style.transform = `perspective(900px) rotateX(${(-py * max).toFixed(2)}deg) rotateY(${(px * max).toFixed(2)}deg)`;
    };
    const onLeave = () => { el.style.transform = ''; };
    el.addEventListener('mousemove', onMove);
    el.addEventListener('mouseleave', onLeave);
    return () => {
      el.removeEventListener('mousemove', onMove);
      el.removeEventListener('mouseleave', onLeave);
    };
  }, [ref, max]);
}

function CountUp({ text }) {
  const ref = useRef(null);
  const [display, setDisplay] = useState(text.replace(/[0-9]/g, '0'));
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const match = text.match(/[0-9]+/);
    if (!match) { setDisplay(text); return; }
    const target = parseInt(match[0], 10);
    const prefix = text.slice(0, match.index);
    const suffix = text.slice(match.index + match[0].length);
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const start = performance.now();
          const duration = 900;
          const tick = (now) => {
            const p = Math.min(1, (now - start) / duration);
            const eased = 1 - Math.pow(1 - p, 3);
            setDisplay(prefix + Math.round(eased * target) + suffix);
            if (p < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
          io.unobserve(el);
        }
      });
    }, { threshold: 0.4 });
    io.observe(el);
    return () => io.disconnect();
  }, [text]);
  return <span ref={ref}>{display}</span>;
}

function ThemeToggle() {
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('kl-theme') || null; } catch (e) { return null; }
  });
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme || '');
    try {
      if (theme) localStorage.setItem('kl-theme', theme);
      else localStorage.removeItem('kl-theme');
    } catch (e) {}
  }, [theme]);
  // Default (no explicit choice yet) renders as dark, so the first click must go to light.
  const next = () => setTheme(t => (t === 'light' ? 'dark' : 'light'));
  return (
    <button className="theme-toggle" onClick={next} aria-label="Toggle color theme">
      {theme === 'light' ? 'Dark mode' : 'Light mode'}
    </button>
  );
}

const CODE_LINES = [
  [{ t: "const " }, { t: "Dashboard", a: true }, { t: " = () => {" }],
  [{ t: "  const [data, setData] = " }, { t: "useState", a: true }, { t: "([]);" }],
  [{ t: "  " }, { t: "useEffect", a: true }, { t: "(() => {" }],
  [{ t: "    fetchData().then(setData);" }],
  [{ t: "  }, []);" }],
  [{ t: "  return " }, { t: "<Table", a: true }, { t: " rows={data} />;" }],
  [{ t: "};" }],
];

// Flatten into one character stream so typing can be revealed smoothly,
// character by character, rather than jumping line by line.
const CODE_CHARS = CODE_LINES.flatMap((line, li) => {
  const chars = [];
  line.forEach(tok => {
    for (const ch of tok.t) chars.push({ ch, a: !!tok.a });
  });
  if (li < CODE_LINES.length - 1) chars.push({ ch: "\n", a: false });
  return chars;
});

function buildTypedLines(count) {
  const lines = [[]];
  for (let i = 0; i < count; i++) {
    const c = CODE_CHARS[i];
    if (c.ch === "\n") { lines.push([]); continue; }
    const current = lines[lines.length - 1];
    const last = current[current.length - 1];
    if (last && last.a === c.a) last.t += c.ch;
    else current.push({ t: c.ch, a: c.a });
  }
  return lines;
}

function TypingCode() {
  const [count, setCount] = useState(prefersReducedMotion() ? CODE_CHARS.length : 0);

  useEffect(() => {
    if (prefersReducedMotion()) return;
    let i = 0;
    let timer;
    const tick = () => {
      i += 1;
      setCount(i);
      if (i < CODE_CHARS.length) {
        timer = setTimeout(tick, 24);
      } else {
        timer = setTimeout(() => { i = 0; setCount(0); tick(); }, 2400);
      }
    };
    timer = setTimeout(tick, 300);
    return () => clearTimeout(timer);
  }, []);

  const lines = buildTypedLines(count);

  return (
    <div className="laptop-code">
      {lines.map((line, i) => (
        <div className="code-line" key={i}>
          {line.map((seg, j) => (
            <span key={j} className={seg.a ? "code-token" : undefined}>{seg.t}</span>
          ))}
          {i === lines.length - 1 && count < CODE_CHARS.length && <span className="code-caret" />}
        </div>
      ))}
    </div>
  );
}

function ContactForm() {
  const [sent, setSent] = useState(false);
  const formRef = useRef(null);

  // Uses Web3Forms (free, no backend) — replace YOUR_ACCESS_KEY_HERE with a key from web3forms.com
  const ACCESS_KEY = "c917915c-ef0d-4aa2-b067-44e049f6d9ba";

  const handleSubmit = async (e) => {
    e.preventDefault();
    const form = formRef.current;
    const data = new FormData(form);
    data.append("access_key", ACCESS_KEY);
    try {
      const res = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        body: data,
      });
      const result = await res.json();
      if (result.success) {
        setSent(true);
        form.reset();
      } else {
        form.submit();
      }
    } catch (err) {
      // Fallback: plain form POST if fetch is blocked in this environment
      form.submit();
    }
  };

  if (sent) {
    return <div className="form-success">Thanks — your message is in. I'll get back to you soon.</div>;
  }

  return (
    <form ref={formRef} onSubmit={handleSubmit} action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value={ACCESS_KEY} />
      <input type="hidden" name="subject" value="New message from portfolio site" />
      <div className="form-field">
        <label htmlFor="name">Name</label>
        <input id="name" name="name" type="text" required placeholder="Your name" />
      </div>
      <div className="form-field">
        <label htmlFor="email">Email</label>
        <input id="email" name="email" type="email" required placeholder="you@example.com" />
      </div>
      <div className="form-field">
        <label htmlFor="message">Message</label>
        <textarea id="message" name="message" required placeholder="What are you looking to build?" />
      </div>
      <button className="btn btn-primary" type="submit">Send message</button>
    </form>
  );
}
